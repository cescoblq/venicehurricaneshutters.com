baseURL = "https://venicehurricaneshutters.com/"
languageCode = "en-US"
title = "Venice Hurricane Shutters — Compare Free Quotes"
theme = "hugo-fresh"
pagination.pagerSize = "6"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]
copyright = "Venice Hurricane Shutters. All rights reserved."

[module]
  [[module.imports]]
    path = "github.com/jgthms/bulma"
    [[module.imports.mounts]]
      source = "bulma.sass"
      target = "assets/bulma/bulma.sass"
    [[module.imports.mounts]]
      source = "bulma-rtl.sass"
      target = "assets/bulma/bulma-rtl.sass"
    [[module.imports.mounts]]
      source = "sass"
      target = "assets/bulma/sass"
    [[module.imports.mounts]]
      source = "sass/base"
      target = "assets/bulma/sass/base"
    [[module.imports.mounts]]
      source = "sass/components"
      target = "assets/bulma/sass/components"
    [[module.imports.mounts]]
      source = "sass/elements"
      target = "assets/bulma/sass/elements"
    [[module.imports.mounts]]
      source = "sass/form"
      target = "assets/bulma/sass/form"
    [[module.imports.mounts]]
      source = "sass/grid"
      target = "assets/bulma/sass/grid"
    [[module.imports.mounts]]
      source = "sass/helpers"
      target = "assets/bulma/sass/helpers"
    [[module.imports.mounts]]
      source = "sass/layout"
      target = "assets/bulma/sass/layout"
    [[module.imports.mounts]]
      source = "sass/utilities"
      target = "assets/bulma/sass/utilities"

[params]
  description = "Compare licensed hurricane shutter installers in Venice, FL. Free, no-obligation estimates for storm panels, accordion, and roll-down shutters. My Safe Florida Home program guidance included."
  leadFormAction = "/api/submit"
  themeColor = "#0c3b5c"
  brandName = "Venice Hurricane Shutters"
  preloader = false
  openGraph = false

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Cost"
  url = "/hurricane-shutters-cost/"
  weight = 2

[[menu.main]]
  name = "My Safe Florida Home"
  url = "/my-safe-florida-home-program/"
  weight = 3

[[menu.main]]
  name = "Shutters vs. Impact Windows"
  url = "/hurricane-shutters-vs-impact-windows/"
  weight = 4

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 5

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 6
